<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Annote — a shared annotation layer for the web">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#facc15"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fde68a" stop-opacity="0.0"/>
      <stop offset="0.1" stop-color="#fde68a" stop-opacity="0.9"/>
      <stop offset="0.9" stop-color="#fde68a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="360" rx="20" fill="url(#bg)"/>

  <!-- faint dotted grid -->
  <g fill="#ffffff" opacity="0.05">
    <circle cx="80" cy="60" r="2"/><circle cx="160" cy="60" r="2"/><circle cx="240" cy="60" r="2"/>
    <circle cx="1120" cy="300" r="2"/><circle cx="1200" cy="300" r="2"/><circle cx="1040" cy="300" r="2"/>
    <circle cx="1200" cy="80" r="2"/><circle cx="1120" cy="120" r="2"/>
  </g>

  <!-- wordmark -->
  <text x="80" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="92" font-weight="700" fill="#f8fafc" filter="url(#soft)">Annote</text>
  <rect x="82" y="168" width="360" height="16" rx="8" fill="url(#hl)"/>

  <text x="84" y="238" font-family="Verdana, Geneva, sans-serif" font-size="27" fill="#cbd5e1">A shared annotation &amp; drawing layer for the web.</text>
  <text x="84" y="278" font-family="Verdana, Geneva, sans-serif" font-size="20" fill="#94a3b8">Highlight, pin, and sketch on any page — synced peer-to-peer, private by design.</text>

  <!-- pencil / annotation motif -->
  <g transform="translate(980 70)" filter="url(#soft)">
    <rect x="0" y="0" width="230" height="150" rx="16" fill="#f8fafc"/>
    <rect x="22" y="30" width="150" height="12" rx="6" fill="#e2e8f0"/>
    <rect x="22" y="56" width="186" height="12" rx="6" fill="url(#hl)"/>
    <rect x="22" y="82" width="120" height="12" rx="6" fill="#e2e8f0"/>
    <!-- pin -->
    <circle cx="186" cy="112" r="20" fill="url(#ink)"/>
    <text x="186" y="120" font-size="22" text-anchor="middle" font-family="sans-serif">📌</text>
    <!-- pencil -->
    <g transform="translate(150 -18) rotate(38)">
      <rect x="0" y="0" width="20" height="96" rx="4" fill="url(#ink)"/>
      <polygon points="0,96 20,96 10,120" fill="#1f2937"/>
      <rect x="0" y="0" width="20" height="14" rx="4" fill="#f472b6"/>
    </g>
  </g>
</svg>
