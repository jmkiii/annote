<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-label="Annote architecture diagram">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1120" height="560" fill="#f8fafc"/>
  <text x="40" y="48" font-family="Verdana, sans-serif" font-size="24" font-weight="700" fill="#0f172a">How Annote works</text>
  <text x="40" y="76" font-family="Verdana, sans-serif" font-size="15" fill="#64748b">Your browser reads pages locally. It only ever talks to Annote relays — never to the sites you visit.</text>

  <!-- Browser boundary -->
  <rect x="40" y="100" width="560" height="410" rx="16" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/>
  <text x="60" y="130" font-family="Verdana, sans-serif" font-size="15" font-weight="700" fill="#4338ca">Your browser</text>

  <!-- Content script -->
  <g filter="url(#s)">
    <rect x="64" y="150" width="248" height="330" rx="12" fill="url(#card)" stroke="#e2e8f0"/>
  </g>
  <text x="80" y="178" font-family="Verdana, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Content script (per tab)</text>
  <g font-family="Verdana, sans-serif" font-size="13" fill="#334155">
    <rect x="80" y="196" width="216" height="52" rx="8" fill="#fef9c3"/>
    <text x="92" y="216">Overlay UI &amp; annotation pins</text>
    <text x="92" y="236" fill="#64748b" font-size="12">highlights, threads, ratings</text>

    <rect x="80" y="258" width="216" height="52" rx="8" fill="#dcfce7"/>
    <text x="92" y="278">Anchor engine</text>
    <text x="92" y="298" fill="#64748b" font-size="12">re-finds text after pages change</text>

    <rect x="80" y="320" width="216" height="52" rx="8" fill="#dbeafe"/>
    <text x="92" y="340">Drawing canvas</text>
    <text x="92" y="360" fill="#64748b" font-size="12">freehand ink strokes</text>

    <rect x="80" y="382" width="216" height="80" rx="8" fill="#f1f5f9"/>
    <text x="92" y="404">Renders others' annotations</text>
    <text x="92" y="424" fill="#64748b" font-size="12">in a closed shadow root, so the</text>
    <text x="92" y="442" fill="#64748b" font-size="12">page can't see or touch it</text>
  </g>

  <!-- Service worker -->
  <g filter="url(#s)">
    <rect x="328" y="150" width="248" height="330" rx="12" fill="url(#card)" stroke="#e2e8f0"/>
  </g>
  <text x="344" y="178" font-family="Verdana, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Background worker</text>
  <g font-family="Verdana, sans-serif" font-size="13" fill="#334155">
    <rect x="344" y="196" width="216" height="52" rx="8" fill="#f1f5f9"/>
    <text x="356" y="216">Signing key (per user)</text>
    <text x="356" y="236" fill="#64748b" font-size="12">signs everything you post</text>

    <rect x="344" y="258" width="216" height="52" rx="8" fill="#f1f5f9"/>
    <text x="356" y="278">Relay pool</text>
    <text x="356" y="298" fill="#64748b" font-size="12">WebSocket, auto-reconnect</text>

    <rect x="344" y="320" width="216" height="52" rx="8" fill="#f1f5f9"/>
    <text x="356" y="340">Local event store</text>
    <text x="356" y="360" fill="#64748b" font-size="12">every annotation you've seen</text>

    <rect x="344" y="382" width="216" height="80" rx="8" fill="#f1f5f9"/>
    <text x="356" y="404">Merge &amp; de-duplicate</text>
    <text x="356" y="424" fill="#64748b" font-size="12">verifies each signature before</text>
    <text x="356" y="442" fill="#64748b" font-size="12">showing anything on the page</text>
  </g>

  <!-- arrow between content and worker -->
  <line x1="312" y1="315" x2="328" y2="315" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="328" y1="345" x2="312" y2="345" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- WSS link -->
  <line x1="600" y1="305" x2="700" y2="305" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="700" y1="335" x2="600" y2="335" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="612" y="296" font-family="Verdana, sans-serif" font-size="12" fill="#475569">WebSocket only</text>

  <!-- Relays -->
  <text x="760" y="130" font-family="Verdana, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Relays</text>
  <text x="760" y="150" font-family="Verdana, sans-serif" font-size="12" fill="#64748b">dumb, interchangeable,</text>
  <text x="760" y="166" font-family="Verdana, sans-serif" font-size="12" fill="#64748b">anyone can run one</text>

  <g filter="url(#s)" font-family="Verdana, sans-serif" font-size="14" fill="#0f172a" text-anchor="middle">
    <rect x="740" y="200" width="150" height="60" rx="12" fill="#fff7ed" stroke="#fdba74"/>
    <text x="815" y="236">Relay A</text>
    <rect x="900" y="200" width="150" height="60" rx="12" fill="#fff7ed" stroke="#fdba74"/>
    <text x="975" y="236">Relay B</text>
    <rect x="820" y="300" width="150" height="60" rx="12" fill="#fff7ed" stroke="#fdba74"/>
    <text x="895" y="336">Relay C</text>
  </g>
  <!-- relay mesh links -->
  <g stroke="#fb923c" stroke-width="2">
    <line x1="890" y1="230" x2="900" y2="230"/>
    <line x1="815" y1="260" x2="880" y2="300"/>
    <line x1="975" y1="260" x2="910" y2="300"/>
  </g>
  <text x="740" y="404" font-family="Verdana, sans-serif" font-size="13" fill="#475569">Store &amp; forward signed events.</text>
  <text x="740" y="424" font-family="Verdana, sans-serif" font-size="13" fill="#475569">No accounts, no trust — a bad relay</text>
  <text x="740" y="444" font-family="Verdana, sans-serif" font-size="13" fill="#475569">can't forge anything, because every</text>
  <text x="740" y="464" font-family="Verdana, sans-serif" font-size="13" fill="#475569">event is signed and checked locally.</text>
</svg>
